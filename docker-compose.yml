services:
  server:
    build:
      context: ./apps/server
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - apps/server/.env

  client:
    build:
      context: ./apps/client
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - server
    environment:
      - VITE_API_URL=http://localhost:8080

  db:
    image: postgres
    restart: always
    shm_size: 128mb
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: SkyRouteAdmin
      POSTGRES_PASSWORD: SkyR0uteP@55w0rd
      POSTGRES_DB: SkyRoute

  adminer:
    image: adminer
    restart: always
    ports:
      - 8081:8080
