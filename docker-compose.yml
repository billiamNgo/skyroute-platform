services:
  server:
    build:
      context: ./
      dockerfile: apps/server/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=${DATABASE_URL}
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    command: sh -c "npx prisma migrate dev --name init && npx prisma db seed && npm start"


  client:
    build:
      context: ./apps/client
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      server:
        condition: service_healthy

    environment:
      - VITE_API_URL=http://localhost:8080

  db:
    image: postgres
    restart: always
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    restart: always
    ports:
      - 8081:8080

  drone-sim-1:
    build:
      context: ./apps/drone-sim
      dockerfile: Dockerfile
    environment:
      - SERVER_URL=http://server:8080
      - SIM_DRONE_ID=1
      - SIM_PHARMACY_ID=1
      - SIM_USER_EMAIL=drones@publix.com
      - SIM_USER_PASSWORD=${SIM_USER_PASSWORD}
    depends_on:
      server:
        condition: service_healthy
    restart: on-failure

